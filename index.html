{if(k!==token||mode!=="page")return;if(qi>=queue.length){stopAll("현재 페이지 읽기를 마쳤습니다.");return}const c=queue[qi];activate(c,`현재 페이지 ${qi+1}/${queue.length} 전체 읽는 중`);const u=new SpeechSynthesisUtterance(`${qi===0?`읽기 대상 ${queue.length}건. `:""}${ordinal(qi+1)} 뉴스. ${textOf(c)}`);u.lang="ko-KR";u.rate=1;if(voice)u.voice=voice;u.onend=()=>{if(k===token){qi++;nextPage(k)}};synth.speak(u)}function startPage(){if(!speechOk)return;stopAll();queue=visibleCards();if(!queue.length)return;mode="page";qi=0;E.pagePlay.disabled=true;E.pageStop.disabled=false;const k=token;nextPage(k)}
function metrics(n=0){const t=day(new Date());E.metricTotal.textContent=state.items.length;E.metricToday.textContent=state.items.filter(x=>day(parse(x.collectedAt))===t).length;E.metricImportant.textContent=state.items.filter(x=>Number(x.importance||0)>=90).length;E.metricShown.textContent=n;E.resultCount.textContent=`${state.page}/${pages()}페이지`}function renderPagination(){const total=pages();if(!state.filtered.length||total<=1){E.pagination.hidden=true;E.pagination.innerHTML="";return}const out=[`<button class="page-button" data-page="${state.page-1}" ${state.page===1?"disabled":""}>이전</button>`];for(let p=1;p<=total;p++)if(p===1||p===total||Math.abs(p-state.page)<=2)out.push(`<button class="page-button${p===state.page?" active":""}" data-page="${p}">${p}</button>`);out.push(`<button class="page-button" data-page="${state.page+1}" ${state.page===total?"disabled":""}>다음</button>`);E.pagination.innerHTML=out.join("");E.pagination.hidden=false}
function render(){stopAll();if(!state.filtered.length){metrics(0);E.cards.hidden=true;E.pagination.hidden=true;E.statusPanel.hidden=false;E.statusPanel.textContent="조건에 맞는 뉴스가 없습니다.";return}const vis=pageItems();metrics(vis.length);E.statusPanel.hidden=true;E.cards.hidden=false;E.cards.innerHTML=vis.map((x,i)=>{const sp=splitSummary(x.summary),url=valid(x.link)?x.link:valid(x.googleNewsLink)?x.googleNewsLink:"",type=modelType(x),title=esc(x.title||"제목 없음"),titleHtml=url?`<a href="${esc(url)}" target="_blank" rel="noopener">${title}</a>`:title;return`<article class="card" data-tts-card><div class="card-top"><span class="badge category" data-tts-text>${esc(x.category||"기타")}</span>${x.relatedArea?`<span class="badge area" data-tts-text>${esc(x.relatedArea)}</span>`:""}<span class="badge ${type}" data-tts-text>${esc(modelLabel(x))}</span><span class="badge score" data-tts-text>중요도 ${Number(x.importance||0)}</span><div class="card-reader"><button class="audio-btn play" data-action="play">▶</button><button class="audio-btn pause" data-action="pause" disabled>Ⅱ</button><button class="audio-btn stop" data-action="stop" disabled>■</button><select class="rate-select" data-action="rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></div></div><h3 class="article-title" data-tts-text>${titleHtml}</h3><p class="article-meta" data-tts-text>${esc(x.source||"언론사 미확인")} · 발행 ${esc(x.publishedAt||"미확인")} · 수집 ${esc(x.collectedAt||"미확인")} · ${esc(x.department||"소관부서 미분류")}</p><div class="summary-grid"><section class="summary-box"><div class="section-title" data-tts-text>뉴스 요약</div><div data-tts-text>${list(sp.news,"뉴스 요약이 없습니다.")}</div></section><section class="summary-box"><div class="section-title" data-tts-text>통합특별시 적용</div><div data-tts-text>${list(sp.application,"별도 적용안이 없습니다.")}</div></section><section class="summary-box"><div class="section-title" data-tts-text>쟁점</div><div data-tts-text>${list(x.issue,"등록된 쟁점이 없습니다.")}</div></section><section class="summary-box"><div class="section-title" data-tts-text>활용 가능 주요 키워드</div><div data-tts-text>${keywords(x.questions)}</div></section></div><div class="basis" data-tts-text>${esc(x.analysisBasis||"분석기준 미확인")}</div><div class="card-read-status" data-read-status>재생 준비</div></article>`}).join("");E.cards.querySelectorAll("[data-tts-card]").forEach(c=>{const p=c.querySelector('[data-action="play"]'),a=c.querySelector('[data-action="pause"]'),s=c.querySelector('[data-action="stop"]'),r=c.querySelector('[data-action="rate"]'),st=c.querySelector("[data-read-status]");p.onclick=()=>speakCard(c);a.onclick=()=>{if(mode!=="card"||activeCard!==c)return;if(synth.paused){synth.resume();a.textContent="Ⅱ";st.textContent=`${r.options[r.selectedIndex].text} 속도로 계속 읽는 중`}else{synth.pause();a.textContent="▶";st.textContent="일시정지"}};s.onclick=()=>stopAll("개별 뉴스 읽기를 정지했습니다.");r.onchange=()=>{if(mode==="card"&&activeCard===c)speakCard(c)}});renderPagination();E.pagePlay.disabled=!speechOk||!vis.length}
function populate(){const cur=E.departmentFilter.value,n=[...new Set(state.items.flatMap(x=>dept(x.department)))].sort((a,b)=>a.localeCompare(b,"ko"));E.departmentFilter.innerHTML='<option value="">부서</option>'+n.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");if(n.includes(cur))E.departmentFilter.value=cur;const dc=E.dateFilter.value,d=[...new Set(state.items.map(x=>day(parse(x.publishedAt||x.collectedAt))).filter(Boolean))].sort().reverse();E.dateFilter.innerHTML='<option value="">발행일</option>'+d.map(x=>`<option value="${x}">${x}</option>`).join("");if(d.includes(dc))E.dateFilter.value=dc}function apply(){const q=E.searchInput.value.trim().toLowerCase(),a=E.areaFilter.value,d=E.departmentFilter.value,dt=E.dateFilter.value,s=E.sortSelect.value;state.filtered=state.items.filter(x=>{const h=[x.title,x.summary,x.issue,x.questions,x.category,x.relatedArea,x.department,x.source].join(" ").toLowerCase();if(q&&!h.includes(q))return false;if(a&&areaGroup(x.relatedArea)!==a)return false;if(d&&!dept(x.department).includes(d))return false;if(dt&&day(parse(x.publishedAt||x.collectedAt))!==dt)return false;return true});state.filtered.sort((a,b)=>{const pa=parse(a.publishedAt)?.getTime()||0,pb=parse(b.publishedAt)?.getTime()||0,ca=parse(a.collectedAt)?.getTime()||0,cb=parse(b.collectedAt)?.getTime()||0;if(s==="published-asc")return pa-pb;if(s==="importance-desc")return Number(b.importance||0)-Number(a.importance||0);if(s==="collected-desc")return cb-ca;return pb-pa});state.page=1;render()}
function cacheGet(){try{const v=localStorage.getItem(KEY);if(!v)return null;const c=JSON.parse(v);return c&&Array.isArray(c.items)&&Date.now()-c.savedAt<TTL?c:null}catch{return null}}function cacheSet(data){try{localStorage.setItem(KEY,JSON.stringify({savedAt:Date.now(),updatedAt:data.updatedAt||"",items:data.items||[]}))}catch{}}function loginView(msg=""){E.authLoading.hidden=true;E.authLogin.hidden=false;E.authOverlay.hidden=false;E.appShell.hidden=true;E.loginError.textContent=msg}function authed(){E.authOverlay.hidden=true;E.appShell.hidden=false;E.refreshButton.hidden=false;E.logoutButton.hidden=false}async function load(force=false){E.refreshButton.disabled=true;const c=!force&&cacheGet();if(c){authed();state.items=c.items;populate();apply();E.updated.textContent=c.updatedAt?`저장된 데이터 즉시 표시 · 최근 확인 ${c.updatedAt}`:`저장된 데이터 ${c.items.length}건 즉시 표시`}else{E.statusPanel.hidden=false;E.statusPanel.textContent="데이터를 불러오는 중입니다."}try{const r=await fetch(force?`/api/news?refresh=1&_=${Date.now()}`:"/api/news",{credentials:"same-origin",cache:force?"no-store":"default",headers:{Accept:"application/json"}});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{data=null}if(r.status===401){loginView();return}if(!r.ok||!data||data.error){if(!c){authed();E.statusPanel.className="status-panel error";E.statusPanel.textContent=data?.error||`서버 오류 HTTP ${r.status}`}return}authed();state.items=Array.isArray(data.items)?data.items:[];cacheSet(data);populate();apply();E.updated.textContent=data.updatedAt?`마지막 데이터 확인 ${data.updatedAt}`:`데이터 ${state.items.length}건 확인`}catch(err){if(!c){authed();E.statusPanel.className="status-panel error";E.statusPanel.textContent="뉴스 API에 연결하지 못했습니다."}}finally{E.refreshButton.disabled=false}}
E.loginForm.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:E.password.value})});if(r.ok){E.password.value="";try{localStorage.removeItem(KEY)}catch{}E.authLoading.hidden=false;E.authLogin.hidden=true;await load(true)}else E.loginError.textContent="로그인 요청을 처리하지 못했습니다."};E.logoutButton.onclick=async()=>{stopAll();try{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"})}finally{try{localStorage.removeItem(KEY)}catch{}state.items=[];state.filtered=[];loginView()}};E.refreshButton.onclick=()=>load(true);[E.searchInput,E.areaFilter,E.departmentFilter,E.dateFilter,E.sortSelect].forEach(x=>x.addEventListener(x.tagName==="INPUT"?"input":"change",apply));E.pagination.onclick=e=>{const b=e.target.closest("button[data-page]");if(!b||b.disabled)return;stopAll();state.page=Math.min(Math.max(1,Number(b.dataset.page)),pages());render();document.querySelector(".result-toolbar")?.scrollIntoView({behavior:"smooth"})};E.pagePlay.onclick=startPage;E.pageStop.onclick=()=>stopAll("현재 페이지 읽기를 멈췄습니다.");if(speechOk){voicePick();synth.onvoiceschanged=voicePick}else E.pagePlay.disabled=true;window.addEventListener("beforeunload",()=>speechOk&&synth.cancel());load();
</script></body></html>
