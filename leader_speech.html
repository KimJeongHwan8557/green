<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>주요 발언</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #202428;
      --panel: #101112;
      --panel-2: #17191b;
      --line: #3a3e43;
      --text: #f4f6f8;
      --muted: #9aabc0;
      --accent: #83b2ff;
      --green: #72d6a4;
      --purple: #a978d6;
      --blue: #7888e5;
      --danger: #ff8e8e;
      --warning: #ffd080;
      --shadow: 0 16px 40px rgba(0, 0, 0, .18);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .shell {
      width: min(1240px, calc(100% - 30px));
      margin: 0 auto;
      padding: 18px 0 70px;
    }


    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(16, 17, 18, .92);
      box-shadow: var(--shadow);
      position: sticky;
      top: 10px;
      z-index: 20;
      backdrop-filter: blur(12px);
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 15px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #b8c5d8;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }
    .nav-link:hover { color: var(--text); border-color: var(--line); }
    .nav-link.active { background: #e8f0ff; color: #17202b; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.12;
      letter-spacing: -.045em;
      text-shadow: 3px 3px 0 rgba(91, 139, 204, .25);
    }
    .lead { margin: 10px 0 0; color: #b8c5d8; font-size: 14px; }
    .updated { margin-top: 10px; color: var(--accent); font-size: 13px; }

    .button {
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #111;
      color: var(--text);
      padding: 12px 16px;
      font-weight: 750;
    }
    .button:hover { border-color: var(--accent); }
    .button.primary { background: #e8f0ff; color: #17202b; border-color: #e8f0ff; }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      flex: 0 0 auto;
    }
    .header-sort {
      width: 104px;
      min-width: 104px;
      flex: 0 0 104px;
      padding: 11px 28px 11px 12px;
      font-size: inherit;
      font-weight: 700;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 170px 190px 155px 190px;
      gap: 10px;
      margin-bottom: 38px;
    }
    .control {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #111;
      color: var(--text);
      padding: 13px 15px;
      outline: none;
    }
    .control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(131, 178, 255, .12); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }
    .metric {
      min-height: 100px;
      padding: 22px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .metric-label { color: var(--accent); font-size: 12px; font-weight: 750; }
    .metric-value { display: block; margin-top: 9px; font-size: 26px; line-height: 1; }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }
    .result-head h2 { margin: 0; font-size: 17px; }
    .result-count { color: var(--accent); font-size: 13px; }

    .status-panel, .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .status-panel { padding: 58px 20px; text-align: center; color: var(--muted); }
    .status-panel.error { color: var(--danger); }
    .status-detail { margin: 12px auto 0; max-width: 760px; font-size: 13px; line-height: 1.7; color: #c7d1df; white-space: pre-wrap; }

    .cards { display: grid; gap: 16px; }
    .card { padding: 22px; }
    .card-top { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #20252b;
      color: #cfdbec;
      font-size: 12px;
      font-weight: 750;
    }
    .badge.category { color: var(--accent); }
    .badge.area { color: var(--green); }
    .badge.gpt { background: rgba(169, 120, 214, .17); color: #d8aff8; }
    .badge.gemini { background: rgba(120, 136, 229, .17); color: #b8c2ff; }
    .badge.unknown { color: #c2c8cf; }
    .badge.score { color: var(--warning); }

    .article-title {
      margin: 0;
      font-size: clamp(19px, 2.2vw, 24px);
      line-height: 1.42;
      letter-spacing: -.025em;
    }
    .article-title a { color: var(--text); text-decoration: none; }
    .article-title a:hover { color: var(--accent); }
    .article-meta { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .summary-box, .section.compact {
      padding: 15px 16px;
      border: 1px solid #30353b;
      border-radius: 14px;
      background: var(--panel-2);
    }
    .section { margin-top: 14px; }
    .section-title {
      margin-bottom: 9px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: -.01em;
    }
    .compact-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .compact-list li {
      position: relative;
      padding-left: 14px;
      color: #dbe3ee;
      font-size: 14px;
      line-height: 1.55;
      word-break: keep-all;
    }
    .compact-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .72em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }
    .keyword-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .keyword-chip {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      padding: 5px 10px;
      border: 1px solid #3a4654;
      border-radius: 999px;
      background: #20262d;
      color: #d9e5f5;
      font-size: 12px;
      font-weight: 720;
      line-height: 1.35;
    }
    .empty-text { margin: 0; color: #9ba8b7; font-size: 13px; }
    .basis { margin-top: 15px; color: #8794a5; font-size: 12px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .text-link { color: var(--accent); text-decoration: none; font-size: 13px; }
    .text-link:hover { text-decoration: underline; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 22px;
    }
    .page-button {
      min-width: 38px;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #111;
      color: var(--text);
      font-weight: 750;
    }
    .page-button:hover:not(:disabled) { border-color: var(--accent); }
    .page-button.active {
      border-color: #e8f0ff;
      background: #e8f0ff;
      color: #17202b;
    }
    .page-button:disabled { cursor: default; opacity: .42; }
    .page-ellipsis { min-width: 24px; text-align: center; color: var(--muted); }

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(20, 23, 26, .97);
    }
    .auth-box {
      width: min(420px, 100%);
      padding: 28px;
      background: #101112;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, .45);
    }
    .auth-box h2 { margin: 0 0 8px; font-size: 24px; }
    .auth-box p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    .auth-form { display: grid; gap: 10px; }
    .auth-error { min-height: 20px; color: var(--danger); font-size: 13px; line-height: 1.5; }
    .loading-dot::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }

    @media (max-width: 1000px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar .search { grid-column: 1 / -1; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 650px) {
      .shell { width: min(100% - 20px, 1240px); }
      .header { align-items: flex-start; flex-direction: column; }
      .header-actions { width: 100%; justify-content: flex-end; }
      .header-sort { width: 104px; min-width: 104px; flex: 0 0 104px; }
      .toolbar { grid-template-columns: 1fr; margin-bottom: 24px; }
      .toolbar .search { grid-column: auto; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric { min-height: 88px; padding: 17px 14px; }
      .card { padding: 18px; }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-box, .section.compact { padding: 14px; }
    }
  
    .badge.speaker { color: var(--green); }
    .badge.speech-type { background: rgba(131, 178, 255, .12); color: #b9d3ff; }
    .speaker-note { color: #aab8ca; font-size: 12px; }
  </style>
</head>
<body>
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
      <div id="authLoading">
        <h2>데이터 확인 중<span class="loading-dot"></span></h2>
        <p>인증 상태와 주요 발언 API 연결을 확인하고 있습니다.</p>
      </div>
      <div id="authLogin" hidden>
        <h2>정책 브리핑</h2>
        <p>입장코드를 입력하세요.</p>
        <form id="loginForm" class="auth-form">
          <input id="password" class="control" type="password" autocomplete="current-password" placeholder="비밀번호" required>
          <button class="button primary" type="submit">로그인</button>
          <div id="loginError" class="auth-error"></div>
        </form>
      </div>
    </div>
  </div>

  <main id="appShell" class="shell" hidden>
    <nav class="top-nav" aria-label="브리핑 메뉴">
      <a class="nav-link" href="/">뉴스</a>
      <a class="nav-link active" href="/leader_speech.html" aria-current="page">주요 발언</a>
    </nav>

    <header class="header">
      <div>
        <h1>주요 발언</h1>
        <p class="lead">대통령·국무총리·부처 장관의 국무회의, 업무보고, 정책 현장 발언을 정리합니다.</p>
        <div id="updated" class="updated">데이터 확인 중</div>
      </div>
      <div class="header-actions">
        <select id="sortSelect" class="control header-sort" aria-label="정렬" hidden>
          <option value="published-desc">정렬</option>
          <option value="published-asc">오래된순</option>
          <option value="importance-desc">중요도순</option>
          <option value="collected-desc">수집일순</option>
        </select>
        <button id="refreshButton" class="button" type="button" hidden>새로고침</button>
        <button id="logoutButton" class="button" type="button" hidden>로그아웃</button>
      </div>
    </header>

    <section class="toolbar" aria-label="주요 발언 필터">
      <input id="searchInput" class="control search" type="search" placeholder="발언자, 정책, 지시사항, 쟁점, 키워드 검색">
      <select id="speakerFilter" class="control" aria-label="발언자">
        <option value="">발언자</option>
      </select>
      <select id="departmentFilter" class="control" aria-label="담당 부서">
        <option value="">담당 부서</option>
      </select>
      <select id="modelFilter" class="control" aria-label="AI 모델">
        <option value="">AI 모델</option>
        <option value="gpt">GPT</option>
        <option value="gemini">Gemini</option>
        <option value="other">기타·미확인</option>
      </select>
      <select id="dateFilter" class="control" aria-label="발행일">
        <option value="">발행일</option>
      </select>
    </section>

    <section class="metrics" aria-label="요약 지표">
      <article class="metric"><span class="metric-label">전체 주요 발언</span><strong id="metricTotal" class="metric-value">0</strong></article>
      <article class="metric"><span class="metric-label">오늘 수집</span><strong id="metricToday" class="metric-value">0</strong></article>
      <article class="metric"><span class="metric-label">중요도 70+</span><strong id="metricImportant" class="metric-value">0</strong></article>
      <article class="metric"><span class="metric-label">현재 표시</span><strong id="metricShown" class="metric-value">0</strong></article>
    </section>

    <section class="result-head">
      <h2>전체 결과</h2>
      <span id="resultCount" class="result-count">0건 표시</span>
    </section>

    <div id="statusPanel" class="status-panel">데이터를 불러오는 중입니다.</div>
    <section id="cards" class="cards" hidden></section>
    <nav id="pagination" class="pagination" aria-label="페이지 이동" hidden></nav>
  </main>

  <script>
    "use strict";

    const state = {
      items: [],
      filtered: [],
      page: 1,
      pageSize: 20
    };

    const AUTH_CHECK_URL = "/api/auth";
    const SESSION_CACHE_TTL_MS = 60 * 1000;


    const elements = {
      authOverlay: document.getElementById("authOverlay"),
      authLoading: document.getElementById("authLoading"),
      authLogin: document.getElementById("authLogin"),
      appShell: document.getElementById("appShell"),
      loginForm: document.getElementById("loginForm"),
      password: document.getElementById("password"),
      loginError: document.getElementById("loginError"),
      logoutButton: document.getElementById("logoutButton"),
      updated: document.getElementById("updated"),
      searchInput: document.getElementById("searchInput"),
      speakerFilter: document.getElementById("speakerFilter"),
      departmentFilter: document.getElementById("departmentFilter"),
      modelFilter: document.getElementById("modelFilter"),
      dateFilter: document.getElementById("dateFilter"),
      sortSelect: document.getElementById("sortSelect"),
      refreshButton: document.getElementById("refreshButton"),
      metricTotal: document.getElementById("metricTotal"),
      metricToday: document.getElementById("metricToday"),
      metricImportant: document.getElementById("metricImportant"),
      metricShown: document.getElementById("metricShown"),
      resultCount: document.getElementById("resultCount"),
      statusPanel: document.getElementById("statusPanel"),
      cards: document.getElementById("cards"),
      pagination: document.getElementById("pagination")
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function validUrl(value) {
      try {
        const url = new URL(String(value || ""));
        return url.protocol === "https:" || url.protocol === "http:";
      } catch (_error) {
        return false;
      }
    }

    function preferredArticleLink(item) {
      if (validUrl(item?.link)) return item.link;
      if (validUrl(item?.googleNewsLink)) return item.googleNewsLink;
      return "";
    }

    function spreadsheetItems(value) {
      const text = String(value || "").replace(/\r/g, "").trim();
      if (!text) return [];
      return text
        .split(/\n+/)
        .map((line) => line
          .replace(/^\s*[-•·▪▶]+\s*/, "")
          .replace(/^\s*\d+[.)]\s*/, "")
          .trim())
        .filter(Boolean);
    }

    function renderSpreadsheetList(value, emptyText) {
      const items = spreadsheetItems(value);
      if (!items.length) return `<p class="empty-text">${escapeHtml(emptyText)}</p>`;
      return `<ul class="compact-list">${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function renderSpreadsheetKeywords(value) {
      const items = spreadsheetItems(value);
      if (!items.length) return '<p class="empty-text">등록된 활용 키워드가 없습니다.</p>';
      return `<div class="keyword-list">${items.map((item) => `<span class="keyword-chip">${escapeHtml(item)}</span>`).join("")}</div>`;
    }

    function parseDate(value) {
      const source = String(value || "").trim();
      if (!source) return null;
      const normalized = source
        .replace(/\./g, "-")
        .replace(/\s+/g, " ")
        .replace(/^(\d{4}-\d{1,2}-\d{1,2}) (\d{1,2}:\d{2})$/, "$1T$2:00+09:00");
      const date = new Date(normalized);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function dayKey(date) {
      if (!date) return "";
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date);
    }

    function modelType(item) {
      const value = `${item.analysisModel || ""} ${item.analysisBasis || ""}`.toLowerCase();
      if (value.includes("gpt") || value.includes("chatgpt")) return "gpt";
      if (value.includes("gemini")) return "gemini";
      return "other";
    }

    function modelLabel(item) {
      return item.analysisModel || (modelType(item) === "gpt" ? "GPT" : modelType(item) === "gemini" ? "Gemini" : "모델 미확인");
    }

    function speakerLabel(item) {
      const speaker = String(item.speaker || "").trim();
      const position = String(item.position || "").trim();
      if (speaker && position && !speaker.includes(position)) return `${speaker} ${position}`;
      return speaker || position || "발언자 미확인";
    }

    function totalPages() {
      return Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
    }

    function pageItems() {
      const pages = totalPages();
      state.page = Math.min(Math.max(1, state.page), pages);
      const start = (state.page - 1) * state.pageSize;
      return state.filtered.slice(start, start + state.pageSize);
    }

    function paginationPages(current, total) {
      const pages = new Set([1, total]);
      for (let page = current - 2; page <= current + 2; page += 1) {
        if (page >= 1 && page <= total) pages.add(page);
      }
      return [...pages].sort((a, b) => a - b);
    }

    function renderPagination() {
      const total = totalPages();
      if (!state.filtered.length || total <= 1) {
        elements.pagination.hidden = true;
        elements.pagination.innerHTML = "";
        return;
      }
      const pages = paginationPages(state.page, total);
      const parts = [
        `<button class="page-button" type="button" data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>이전</button>`
      ];
      let previous = 0;
      pages.forEach((page) => {
        if (previous && page - previous > 1) parts.push('<span class="page-ellipsis">…</span>');
        parts.push(`<button class="page-button${page === state.page ? " active" : ""}" type="button" data-page="${page}" ${page === state.page ? 'aria-current="page"' : ""}>${page}</button>`);
        previous = page;
      });
      parts.push(`<button class="page-button" type="button" data-page="${state.page + 1}" ${state.page === total ? "disabled" : ""}>다음</button>`);
      elements.pagination.innerHTML = parts.join("");
      elements.pagination.hidden = false;
    }

    async function readJson(response) {
      const raw = await response.text();
      try {
        return { data: JSON.parse(raw), raw };
      } catch (_error) {
        return { data: null, raw };
      }
    }

    function clearSessionCaches() {
      try {
        sessionStorage.removeItem("newsCache");
        sessionStorage.removeItem("leaderSpeechCache");
      } catch (_error) {}
    }

    function readSessionCache(key) {
      try {
        const cached = JSON.parse(sessionStorage.getItem(key) || "null");
        if (!cached || !Array.isArray(cached.items)) return null;
        if (Date.now() - Number(cached.savedAt || 0) >= SESSION_CACHE_TTL_MS) {
          sessionStorage.removeItem(key);
          return null;
        }
        return cached;
      } catch (_error) {
        try { sessionStorage.removeItem(key); } catch (__error) {}
        return null;
      }
    }

    function writeSessionCache(key, data, items) {
      try {
        sessionStorage.setItem(key, JSON.stringify({
          savedAt: Date.now(),
          updatedAt: data?.updatedAt || "",
          items
        }));
      } catch (_error) {}
    }

    async function checkAuthenticatedSession() {
      try {
        const response = await fetch(AUTH_CHECK_URL, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: { Accept: "application/json" }
        });
        if (response.status === 401) return false;
        if (response.ok) return true;
        return null;
      } catch (_error) {
        return null;
      }
    }


    function showLogin(message = "") {
      elements.authLoading.hidden = true;
      elements.authLogin.hidden = false;
      elements.authOverlay.hidden = false;
      elements.appShell.hidden = true;
      elements.sortSelect.hidden = true;
      elements.refreshButton.hidden = true;
      elements.logoutButton.hidden = true;
      elements.loginError.textContent = message;
      setTimeout(() => elements.password.focus(), 0);
    }

    function showAuthenticated() {
      elements.authOverlay.hidden = true;
      elements.appShell.hidden = false;
      elements.sortSelect.hidden = false;
      elements.refreshButton.hidden = false;
      elements.logoutButton.hidden = false;
    }

    function showStatus(message, detail = "", isError = false) {
      elements.cards.hidden = true;
      elements.pagination.hidden = true;
      elements.statusPanel.hidden = false;
      elements.statusPanel.className = `status-panel${isError ? " error" : ""}`;
      elements.statusPanel.innerHTML = `${escapeHtml(message)}${detail ? `<div class="status-detail">${escapeHtml(detail)}</div>` : ""}`;
    }

    function updateMetrics(visibleCount = 0) {
      const today = dayKey(new Date());
      const all = state.items;
      const pages = totalPages();
      elements.metricTotal.textContent = all.length;
      elements.metricToday.textContent = all.filter((item) => dayKey(parseDate(item.collectedAt)) === today).length;
      elements.metricImportant.textContent = all.filter((item) => Number(item.importance || 0) >= 70).length;
      elements.metricShown.textContent = visibleCount;
      elements.resultCount.textContent = `총 ${state.filtered.length}건 · ${state.page}/${pages}페이지 · ${visibleCount}건 표시`;
    }

    function renderCards() {
      if (!state.filtered.length) {
        updateMetrics(0);
        showStatus("조건에 맞는 주요 발언이 없습니다.");
        return;
      }

      const visibleItems = pageItems();
      updateMetrics(visibleItems.length);
      elements.statusPanel.hidden = true;
      elements.cards.hidden = false;
      elements.cards.innerHTML = visibleItems.map((item) => {
        const type = modelType(item);
        const title = escapeHtml(item.title || "제목 없음");
        const articleLink = preferredArticleLink(item);
        const titleHtml = articleLink
          ? `<a href="${escapeHtml(articleLink)}" target="_blank" rel="noopener noreferrer">${title}</a>`
          : title;
        const links = [];
        if (validUrl(item.link)) {
          links.push(`<a class="text-link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">원문 열기</a>`);
        }
        if (validUrl(item.googleNewsLink) && item.googleNewsLink !== item.link) {
          links.push(`<a class="text-link" href="${escapeHtml(item.googleNewsLink)}" target="_blank" rel="noopener noreferrer">Google 뉴스 열기</a>`);
        }

        return `
          <article class="card">
            <div class="card-top">
              <span class="badge category">${escapeHtml(item.category || "정책 일반")}</span>
              <span class="badge speaker">${escapeHtml(speakerLabel(item))}</span>
              <span class="badge speech-type">${escapeHtml(item.department || "담당부서 미분류")}</span>
              <span class="badge ${type === "other" ? "unknown" : type}">${escapeHtml(modelLabel(item))}</span>
              <span class="badge score">중요도 ${Number(item.importance || 0)}</span>
            </div>
            <h3 class="article-title">${titleHtml}</h3>
            <p class="article-meta">${escapeHtml(item.source || "출처 미확인")} · 발행 ${escapeHtml(item.publishedAt || "미확인")} · 수집 ${escapeHtml(item.collectedAt || "미확인")}</p>
            ${item.eventName ? `<p class="speaker-note">회의·행사: ${escapeHtml(item.eventName)}</p>` : ""}
            <div class="summary-grid">
              <section class="summary-box">
                <div class="section-title">핵심 발언</div>
                ${renderSpreadsheetList(item.summary, "핵심 발언 요약이 없습니다.")}
              </section>
              <section class="summary-box">
                <div class="section-title">정책 방향·지시사항</div>
                ${renderSpreadsheetList(item.direction, "별도 정책 방향이나 지시사항이 없습니다.")}
              </section>
            </div>
            <section class="section compact">
              <div class="section-title">주요 쟁점</div>
              ${renderSpreadsheetList(item.issue, "등록된 쟁점이 없습니다.")}
            </section>
            <section class="section compact">
              <div class="section-title">북구 대응·활용 키워드</div>
              ${renderSpreadsheetKeywords(item.keywords)}
            </section>
            ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
            <div class="basis">${escapeHtml(item.analysisBasis || "분석기준 미확인")}</div>
          </article>`;
      }).join("");

      renderPagination();
    }

    function populateFilters() {
      const speakerCurrent = elements.speakerFilter.value;
      const departmentCurrent = elements.departmentFilter.value;
      const speakers = [...new Set(state.items.map(speakerLabel).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
      const departments = [...new Set(state.items.map((item) => String(item.department || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));

      elements.speakerFilter.innerHTML = [
        '<option value="">발언자</option>',
        ...speakers.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
      ].join("");
      elements.departmentFilter.innerHTML = [
        '<option value="">담당 부서</option>',
        ...departments.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
      ].join("");

      if (speakers.includes(speakerCurrent)) elements.speakerFilter.value = speakerCurrent;
      if (departments.includes(departmentCurrent)) elements.departmentFilter.value = departmentCurrent;
    }

    function populateDateFilter() {
      const current = elements.dateFilter.value;
      const dates = [...new Set(
        state.items
          .map((item) => dayKey(parseDate(item.publishedAt || item.collectedAt)))
          .filter(Boolean)
      )].sort((a, b) => b.localeCompare(a));

      elements.dateFilter.innerHTML = [
        '<option value="">발행일</option>',
        ...dates.map((date) => `<option value="${date}">${date}</option>`)
      ].join("");

      if (dates.includes(current)) {
        elements.dateFilter.value = current;
      }
    }

    function applyFilters() {
      const query = elements.searchInput.value.trim().toLowerCase();
      const selectedSpeaker = elements.speakerFilter.value;
      const selectedDepartment = elements.departmentFilter.value;
      const selectedModel = elements.modelFilter.value;
      const selectedDate = elements.dateFilter.value;
      const sort = elements.sortSelect.value;

      state.filtered = state.items.filter((item) => {
        const haystack = [
          item.title, item.speaker, item.position, item.department, item.speechType, item.eventName,
          item.category, item.summary, item.direction, item.issue, item.keywords, item.source
        ].join(" ").toLowerCase();
        if (query && !haystack.includes(query)) return false;
        if (selectedSpeaker && speakerLabel(item) !== selectedSpeaker) return false;
        if (selectedDepartment && String(item.department || "") !== selectedDepartment) return false;
        if (selectedModel && modelType(item) !== selectedModel) return false;

        if (selectedDate) {
          const date = parseDate(item.publishedAt || item.collectedAt);
          if (!date || dayKey(date) !== selectedDate) return false;
        }
        return true;
      });

      state.filtered.sort((a, b) => {
        const publishedA = parseDate(a.publishedAt)?.getTime() || 0;
        const publishedB = parseDate(b.publishedAt)?.getTime() || 0;
        const collectedA = parseDate(a.collectedAt)?.getTime() || 0;
        const collectedB = parseDate(b.collectedAt)?.getTime() || 0;
        if (sort === "published-asc") return publishedA - publishedB;
        if (sort === "importance-desc") return Number(b.importance || 0) - Number(a.importance || 0);
        if (sort === "collected-desc") return collectedB - collectedA;
        return publishedB - publishedA;
      });

      state.page = 1;
      renderCards();
    }

    async function loadSpeeches(forceRefresh = false) {
      elements.refreshButton.disabled = true;

      if (!forceRefresh) {
        const cached = readSessionCache("leaderSpeechCache");
        if (cached) {
          const authenticated = await checkAuthenticatedSession();
          if (authenticated === false) {
            clearSessionCaches();
            state.items = [];
            state.filtered = [];
            showLogin();
            elements.refreshButton.disabled = false;
            return;
          }
          if (authenticated === true) {
            showAuthenticated();
            state.items = cached.items;
            populateFilters();
            populateDateFilter();
            elements.updated.textContent = cached.updatedAt
              ? `마지막 데이터 확인 ${cached.updatedAt}`
              : `데이터 ${state.items.length}건 확인`;
            applyFilters();
            elements.refreshButton.disabled = false;
            return;
          }
        }
      }

      elements.updated.textContent = "데이터 확인 중";
      showStatus("데이터를 불러오는 중입니다.");

      try {
        const endpoint = forceRefresh ? "/api/leader-speeches?refresh=1" : "/api/leader-speeches";
        const response = await fetch(endpoint, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: { Accept: "application/json" }
        });
        const { data, raw } = await readJson(response);

        if (response.status === 401) {
          clearSessionCaches();
          state.items = [];
          state.filtered = [];
          showLogin();
          return;
        }
        if (!data) {
          showAuthenticated();
          showStatus("서버 응답을 해석하지 못했습니다.", `HTTP ${response.status}\n${String(raw || "").slice(0, 240)}`, true);
          return;
        }
        if (!response.ok || data.error) {
          showAuthenticated();
          const detail = [
            data.hint || "",
            data.missing ? `누락 환경변수: ${data.missing.join(", ")}` : "",
            data.preview ? `상위 응답: ${data.preview}` : "",
            data.detail ? `상세: ${typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)}` : ""
          ].filter(Boolean).join("\n");
          showStatus(data.error || `서버 오류가 발생했습니다. HTTP ${response.status}`, detail, true);
          return;
        }

        showAuthenticated();
        state.items = Array.isArray(data.items) ? data.items : [];
        writeSessionCache("leaderSpeechCache", data, state.items);
        populateFilters();
        populateDateFilter();
        elements.updated.textContent = data.updatedAt
          ? `마지막 데이터 확인 ${data.updatedAt}`
          : `데이터 ${state.items.length}건 확인`;
        applyFilters();
      } catch (error) {
        showAuthenticated();
        showStatus("주요 발언 API에 연결하지 못했습니다.", error instanceof Error ? error.message : "unknown error", true);
      } finally {
        elements.refreshButton.disabled = false;
      }
    }

    elements.loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      elements.loginError.textContent = "";
      const submitButton = elements.loginForm.querySelector("button[type=submit]");
      submitButton.disabled = true;
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ password: elements.password.value })
        });
        const { data } = await readJson(response);
        if (!response.ok || !data || !data.ok) {
          elements.loginError.textContent = data?.error || "로그인 요청을 처리하지 못했습니다.";
          return;
        }
        elements.password.value = "";
        clearSessionCaches();
        elements.authLoading.hidden = false;
        elements.authLogin.hidden = true;
        await loadSpeeches(true);
      } catch (error) {
        elements.loginError.textContent = error instanceof Error ? error.message : "로그인 연결 오류";
      } finally {
        submitButton.disabled = false;
      }
    });

    elements.logoutButton.addEventListener("click", async () => {
      try {
        await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
      } finally {
        clearSessionCaches();
        state.items = [];
        state.filtered = [];
        showLogin();
      }
    });

    elements.pagination.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-page]");
      if (!button || button.disabled) return;
      const requestedPage = Number(button.dataset.page);
      if (!Number.isFinite(requestedPage)) return;
      state.page = Math.min(Math.max(1, requestedPage), totalPages());
      renderCards();
      document.querySelector(".result-head")?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    elements.refreshButton.addEventListener("click", () => loadSpeeches(true));
    [elements.searchInput, elements.speakerFilter, elements.departmentFilter, elements.modelFilter, elements.dateFilter, elements.sortSelect]
      .forEach((element) => element.addEventListener(element.tagName === "INPUT" ? "input" : "change", applyFilters));

    loadSpeeches();
  </script>
</body>
</html>
