<style>

22px 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.metric-label{color:var(--accent);font-size:12px;font-weight:750}.metric-value{display:block;margin-top:9px;font-size:26px;line-height:1}.metric-button{padding:0;border:0;background:transparent;color:var(--text);font-weight:800}.result-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:nowrap;width:100%}.result-head{display:inline-flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);flex:0 0 auto}.result-head h2{margin:0;font-size:16px}.result-count{color:var(--accent);font-size:13px}.page-reader{display:inline-flex;align-items:center;gap:7px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-left:auto;flex:0 0 auto}.audio-btn{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 8px;border:1px solid #414a56;border-radius:9px;background:#15181d;color:#dbe4f0;font-size:12px;font-weight:800}.audio-btn:hover:not(:disabled){border-color:var(--accent)}.audio-btn:disabled{opacity:.35;cursor:default}.audio-btn.play{color:#dceaff}.audio-btn.pause{color:#ffe0a6}.audio-btn.stop{color:#ffb7b7}.page-play,.page-stop{height:38px}.status-panel,.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}.status-panel{padding:58px 20px;text-align:center;color:var(--muted)}.status-panel.error{color:var(--danger)}.cards{display:grid;gap:16px}.card{padding:22px}.card.tts-active{border-color:rgba(114,214,164,.8);box-shadow:0 0 0 3px rgba(114,214,164,.08),var(--shadow)}.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:12px}.badge{display:inline-flex;align-items:center;min-height:27px;padding:5px 9px;border-radius:999px;background:#20252b;col );font-weight:750}.page-button.active{background:#e8f0ff;color:#17202b}.page-button:disabled{opacity:.42;cursor:default}.auth-overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(20,23,26,.97)}.auth-box{width:min(420px,100%);padding:28px;background:#101112;border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 80px rgba(0,0,0,.45)}.auth-box h2{margin:0 0 8px;font-size:24px}.auth-box p{margin:0 0 18px;color:var(--muted);line-height:1.6}.auth-form{display:grid;gap:10px}.auth-error{min-height:20px;color:var(--danger);font-size:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<body>
<div id="authOverlay" class="auth-overlay"><div class="auth-box"><div id="authLoading"><h2>데이터 확인 중…</h2><p>인증 상태와 뉴스 API 연결을 확인하고 있습니다.</p></div><div id="authLogin" hidden><h2>뉴스 브리핑</h2><p>입장코드를 입력하세요.</p><form id="loginForm" class="auth-form"><input id="password" class="control" type="password" autocomplete="current-password" placeholder="비밀번호" required><button class="button primary" type="submit">로그인</button><div id="loginError" class="auth-error"></div></form></div></div></div>
<main id="appShell" class="shell" hidden>
<nav class="top-nav"><a class="nav-link active" href="/">뉴스</a><a class="nav-link" href="/leader_speech.html">주요 발언</a></nav>
<header class="header"><div><h1>뉴스 브리핑</h1><p class="lead">전국의 정책 사례를 전남광주통합특별시의 권역별 사업과 의정활동으로 연결합니다.</p><div id="updated" class="updated">데이터 확인 중</div></div><div class="header-actions"><button id="refreshButton" class="button" hidden>새로고침</button><button id="logoutButton" class="button" hidden>로그아웃</button></div></header>
<section class="toolbar"><input id="searchInput" class="control search" type="search" placeholder="정책, 연계방안, 권역, 부서, 쟁점 검색"><select id="areaFilter" class="control"><option value="">지역</option><option value="national">전국</option><option value="jeonnam-gwangju">전남광주</option><option value="seoul">서울</option><option value="gyeonggi">경기인천</option><option value="jeonbuk">전북권</option><option value="gangwon">강원권</option><option value="chungcheong">충청권</option><option value="gyeongsang">경상권</option><option value="jeju">제주권</option><option value="other">기타·미분류</option></select><select id="departmentFilter" class="control"><option value="">부서</option></select><select id="dateFilter" class="control"><option value="">발행일</option></select><select id="sortSelect" class="control"><option value="published-desc">정렬</option><option value="published-asc">오래된순</option><option value="importance-desc">중요도순</option><option value="collected-desc">수집일순</option></select></section>
<section class="metrics"><article class="metric"><span class="metric-label">전체 정책 사례</span><button id="metricTotal" class="metric-value metric-button" type="button">0</button></article><article class="metric"><span class="metric-label">오늘 수집</span><button id="metricToday" class="metric-value metric-button" type="button">0</button></article><article class="metric"><span class="metric-label">중요도 90+</span><button id="metricImportant" class="metric-value metric-button" type="button">0</button></article><article class="metric"><span class="metric-label">현재 표시</span><button id="metricShown" class="metric-value metric-button" type="button">0</button></article></section>
<section class="result-toolbar"><div class="result-head"><h2>전체 결과</h2><span id="resultCount" class="result-count">0건</span></div><nav id="pagination" class="pagination" hidden></nav><div class="page-reader"><button id="pagePlay" class="audio-btn play page-play" type="button">▶ 현재 페이지</button><button id="pageStop" class="audio-btn stop page-stop" type="button" disabled>■ 멈춤</button></div><span id="pageLive" class="sr-only"></span></section>
<div id="statusPanel" class="status-panel">데이터를 불러오는 중입니다.</div><section id="cards" class="cards" hidden></section>
</main>
<script>
"use strict";
const state={items:[],filtered:[],page:1,pageSize:20};
const CACHE_KEY="psobukgu.dashboard.news.v4";
const OLD_KEYS=["psobukgu.dashboard.news.v3","psobukgu.dashboard.news.v2"];
const TTL=24*60*60*1000;
const $=id=>document.getElementById(id);
const E={authOverlay:$("authOverlay"),authLoading:$("authLoading"),authLogin:$("authLogin"),appShell:$("appShell"),loginForm:$("loginForm"),password:$("password"),loginError:$("loginError"),logoutButton:$("logoutButton"),refreshButton:$("refreshButton"),updated:$("updated"),searchInput:$("searchInput"),areaFilter:$("areaFilter"),departmentFilter:$("departmentFilter"),dateFilter:$("dateFilter"),sortSelect:$("sortSelect"),metricTotal:$("metricTotal"),metricToday:$("metricToday"),metricImportant:$("metricImportant"),metricShown:$("metricShown"),resultCount:$("resultCount"),pagination:$("pagination"),statusPanel:$("statusPanel"),cards:$("cards"),pagePlay:$("pagePlay"),pageStop:$("pageStop"),pageLive:$("pageLive")};
const tts={supported:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,mode:"",cardIndex:-1,pageIndices:[],pagePos:0,utterance:null,paused:false,rate:1};
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const valid=u=>{try{return["http:","https:"].includes(new URL(String(u||"")).protocol)}catch{return false}};
const parse=v=>{const s=String(v||"").trim().replace(/\./g,"-");const d=new Date(s.replace(/^(\d{4}-\d{1,2}-\d{1,2}) (\d{1,2}:\d{2})$/,"$1T$2:00+09:00"));return isNaN(d)?null:d};
const day=d=>d?new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(d):"";
const lines=v=>String(v||"").replace(/\r/g,"").trim().split(/\n+/).map(x=>x.replace(/^\s*[-•·▪▶]+\s*/,"").replace(/^\s*\d+[.)]\s*/,"").trim()).filter(Boolean);
const list=(v,e)=>{const a=lines(v);return a.length?`<ul class="compact-list">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="empty-text">${esc(e)}</p>`};
const keywords=v=>{const a=lines(v);return a.length?`<div class="keyword-list">${a.map(x=>`<span class="keyword-chip">${esc(x)}</span>`).join("")}</div>`:'<p class="empty-text">등록된 주요 키워드가 없습니다.</p>'};
function splitLegacySummary(v){const t=String(v||"").replace(/\r/g,"").trim();const m=/\s*\[전남광주통합특별시 적용\]\s*/i.exec(t);return m?{news:t.slice(0,m.index).replace(/\s*\[(?:뉴스|정책) 요약\]\s*/i,"").trim(),application:t.slice(m.index+m[0].length).trim()}:{news:t.replace(/\s*\[(?:뉴스|정책) 요약\]\s*/i,"").trim(),application:""}}
function normalizeItem(raw){const legacy=splitLegacySummary(raw?.summary);return{...raw,newsSummary:String(raw?.newsSummary||legacy.news||""),specialCityApplication:String(raw?.specialCityApplication||legacy.application||""),issue:String(raw?.issue||raw?.issues||""),questions:String(raw?.questions||raw?.keywords||raw?.applicationKeywords||""),department:String(raw?.department||raw?.relatedDepartment||""),relatedArea:String(raw?.relatedArea||raw?.area||""),source:String(raw?.source||raw?.publisher||""),link:String(raw?.link||raw?.originalLink||""),searchSourceLink:String(raw?.searchSourceLink||raw?.naverNewsLink||raw?.googleNewsLink||"")}};
function areaGroup(v){v=String(v||"").replace(/\s+/g,"");if(/서울특별시|서울/.test(v))return"seoul";if(/인천광역시|인천|경기도|경기|수원|성남|고양|용인|화성|안산|안양|평택|시흥|김포|광명|파주|의정부|남양주|하남|군포|오산|이천|안성|양주|구리|포천|의왕|여주|동두천|과천|가평|양평|연천/.test(v))return"gyeonggi";if(/전북특별자치도|전라북도|전북|전주|군산|익산|정읍|남원|김제|완주|진안|무주|장수|임실|순창|고창|부안/.test(v))return"jeonbuk";if(/광주광역시|광주|전라남도|전남|목포|여수|순천|나주|광양|담양|곡성|구례|고흥|보성|화순|장흥|강진|해남|영암|무안|함평|영광|장성|완도|진도|신안/.test(v))return"jeonnam-gwangju";if(/강원|춘천|원주|강릉/.test(v))return"gangwon";if(/대전|세종|충북|충남|충청/.test(v))return"chungcheong";if(/경상권|경상남도|경상북도|경남|경북|부산|대구|울산|영남|창원|포항|구미|김해|진주|경주|안동|거제|양산|통영|밀양|영주|상주|문경|경산/.test(v))return"gyeongsang";if(/제주/.test(v))return"jeju";if(/전국|중앙정부|국가|대한민국/.test(v))return"national";return"other"}
function dept(v){return String(v||"").split(/[·,\/|;]+/).map(x=>x.trim()).filter(Boolean)}
function authed(){E.authOverlay.hidden=true;E.appShell.hidden=false;E.refreshButton.hidden=false;E.logoutButton.hidden=false}
function loginView(msg=""){stopSpeech();E.authLoading.hidden=true;E.authLogin.hidden=false;E.authOverlay.hidden=false;E.appShell.hidden=true;E.loginError.textContent=msg}
function cacheGet(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;const c=JSON.parse(raw);if(!c||!Array.isArray(c.items)||!c.items.length||Date.now()-c.savedAt>TTL)return null;return c}catch{return null}}
function cacheSet(data){try{if(Array.isArray(data.items)&&data.items.length)localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),updatedAt:data.updatedAt||"",items:data.items}))}catch{}}
function clearOldCaches(){try{OLD_KEYS.forEach(k=>localStorage.removeItem(k))}catch{}}
function populate(){const currentDept=E.departmentFilter.value;const depts=[...new Set(state.items.flatMap(x=>dept(x.department)))].sort((a,b)=>a.localeCompare(b,"ko"));E.departmentFilter.innerHTML='<option value="">부서</option>'+depts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");if(depts.includes(currentDept))E.departmentFilter.value=currentDept;const currentDate=E.dateFilter.value;const dates=[...new Set(state.items.map(x=>day(parse(x.publishedAt||x.collectedAt))).filter(Boolean))].sort().reverse();E.dateFilter.innerHTML='<option value="">발행일</option>'+dates.map(x=>`<option value="${x}">${x}</option>`).join("");if(dates.includes(currentDate))E.dateFilter.value=currentDate}
function apply(){stopSpeech();const q=E.searchInput.value.trim().toLowerCase(),area=E.areaFilter.value,dep=E.departmentFilter.value,date=E.dateFilter.value,sort=E.sortSelect.value;state.filtered=state.items.filter(x=>{const hay=[x.title,x.newsSummary,x.specialCityApplication,x.issue,x.questions,x.category,x.relatedArea,x.department,x.source].join(" ").toLowerCase();if(q&&!hay.includes(q))return false;if(area&&areaGroup(x.relatedArea)!==area)return false;if(dep&&!dept(x.department).includes(dep))return false;if(date&&day(parse(x.publishedAt||x.collectedAt))!==date)return false;return true});state.filtered.sort((a,b)=>{const pa=parse(a.publishedAt)?.getTime()||0,pb=parse(b.publishedAt)?.getTime()||0,ca=parse(a.collectedAt)?.getTime()||0,cb=parse(b.collectedAt)?.getTime()||0;if(sort==="published-asc")return pa-pb;if(sort==="importance-desc")return Number(b.importance||0)-Number(a.importance||0);if(sort==="collected-desc")return cb-ca;return pb-pa});state.page=1;render()}
function visibleSlice(){const start=(state.page-1)*state.pageSize;return state.filtered.slice(start,start+state.pageSize).map((item,offset)=>({item,index:start+offset}))}
function render(){const totalPages=Math.max(1,Math.ceil(state.filtered.length/state.pageSize));state.page=Math.min(state.page,totalPages);E.metricTotal.textContent=state.items.length;E.metricToday.textContent=state.items.filter(x=>day(parse(x.collectedAt))===day(new Date())).length;E.metricImportant.textContent=state.items.filter(x=>Number(x.importance||0)>=90).length;E.metricShown.textContent=state.filtered.length;E.resultCount.textContent=`${state.filtered.length}건 · ${state.page}/${totalPages}페이지`;if(!state.filtered.length){stopSpeech();E.cards.hidden=true;E.pagination.hidden=true;E.statusPanel.className="status-panel";E.statusPanel.hidden=false;E.statusPanel.textContent=state.items.length?"조건에 맞는 뉴스가 없습니다.":"뉴스 데이터가 0건입니다. 새로고침을 눌러 다시 확인해 주세요.";return}const visible=visibleSlice();E.statusPanel.hidden=true;E.cards.hidden=false;E.cards.innerHTML=visible.map(({item:x,index})=>{const url=valid(x.link)?x.link:valid(x.searchSourceLink)?x.searchSourceLink:"";const title=esc(x.title||"제목 없음");return`<article class="card" data-card-index="${index}"><div class="card-top"><span class="badge category">${esc(x.category||"기타")}</span>${x.relatedArea?`<span class="badge area">${esc(x.relatedArea)}</span>`:""}${x.department?`<span class="badge department">${esc(x.department)}</span>`:""}${x.analysisModel?`<span class="badge model">${esc(x.analysisModel)}</span>`:""}<span class="badge score">중요도 ${Number(x.importance||0)}</span><div class="card-reader"><button class="audio-btn play" type="button" data-tts="play" data-index="${index}" ${tts.supported?"":"disabled"} aria-label="이 뉴스 재생">▶</button><button class="audio-btn pause" type="button" data-tts="pause" data-index="${index}" disabled aria-label="일시정지">⏸</button><button class="audio-btn stop" type="button" data-tts="stop" data-index="${index}" disabled aria-label="정지">■</button><select class="rate-select" data-tts-rate="${index}" ${tts.supported?"":"disabled"} aria-label="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select></div></div><h3 class="article-title">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${title}</a>`:title}</h3><p class="article-meta">${esc(x.source||"언론사 미확인")} · 발행 ${esc(x.publishedAt||"미확인")} · 수집 ${esc(x.collectedAt||"미확인")}</p><div class="summary-grid"><section class="summary-box"><div class="section-title">뉴스 요약</div>${list(x.newsSummary,"뉴스 요약이 없습니다.")}</section><section class="summary-box"><div class="section-title">전남광주통합특별시 적용</div>${list(x.specialCityApplication,"별도 적용안이 없습니다.")}</section><section class="summary-box"><div class="section-title">쟁점</div>${list(x.issue,"등록된 쟁점이 없습니다.")}</section><section class="summary-box"><div class="section-title">활용 가능 주요 키워드</div>${keywords(x.questions)}</section></div><div class="basis">${esc(x.analysisBasis||"분석기준 미확인")}</div><div class="card-read-status" data-tts-status="${index}"></div></article>`}).join("");renderPagination(totalPages);syncTtsUi()}
function renderPagination(total){if(total<=1){E.pagination.hidden=true;E.pagination.innerHTML="";return}const out=[];out.push(`<button class="page-button" data-page="${state.page-1}" ${state.page===1?"disabled":""}>이전</button>`);for(let p=1;p<=total;p++){if(p===1||p===total||Math.abs(p-state.page)<=2)out.push(`<button class="page-button${p===state.page?" active":""}" data-page="${p}">${p}</button>`)}out.push(`<button class="page-button" data-page="${state.page+1}" ${state.page===total?"disabled":""}>다음</button>`);E.pagination.innerHTML=out.join("");E.pagination.hidden=false}
function plainSpeechText(v){return lines(v).join(". ").replace(/\s+/g," ").trim()}
function newsSpeechText(x){const parts=[];parts.push(`제목. ${String(x.title||"제목 없음")}.`);if(x.source)parts.push(`언론사. ${x.source}.`);if(x.publishedAt)parts.push(`발행일. ${x.publishedAt}.`);if(x.department)parts.push(`소관부서. ${x.department}.`);const summary=plainSpeechText(x.newsSummary);if(summary)parts.push(`뉴스 요약. ${summary}.`);const application=plainSpeechText(x.specialCityApplication);if(application)parts.push(`전남광주통합특별시 적용. ${application}.`);const issue=plainSpeechText(x.issue);if(issue)parts.push(`쟁점. ${issue}.`);const key=plainSpeechText(x.questions);if(key)parts.push(`활용 가능 주요 키워드. ${key}.`);return parts.join(" ")}
function koreanVoice(){if(!tts.supported)return null;const voices=window.speechSynthesis.getVoices();return voices.find(v=>/^ko(-|_)/i.test(v.lang))||voices.find(v=>/korean|한국/i.test(`${v.name} ${v.lang}`))||null}
function resetTtsState(){tts.mode="";tts.cardIndex=-1;tts.pageIndices=[];tts.pagePos=0;tts.utterance=null;tts.paused=false;tts.rate=1}
function stopSpeech(){if(tts.supported)window.speechSynthesis.cancel();resetTtsState();syncTtsUi()}
function setCardStatus(index,text){const el=document.querySelector(`[data-tts-status="${index}"]`);if(el)el.textContent=text||""}
function syncTtsUi(){const active=tts.cardIndex;document.querySelectorAll(".card").forEach(card=>card.classList.toggle("tts-active",Number(card.dataset.cardIndex)===active));document.querySelectorAll('[data-tts="play"]').forEach(btn=>{const same=Number(btn.dataset.index)===active;btn.disabled=!tts.supported||(same&&!tts.paused&&tts.utterance!=null)});document.querySelectorAll('[data-tts="pause"]').forEach(btn=>{const same=Number(btn.dataset.index)===active;btn.disabled=!tts.supported||!same||tts.utterance==null;btn.textContent=same&&tts.paused?"▶":"⏸";btn.setAttribute("aria-label",same&&tts.paused?"계속 재생":"일시정지")});document.querySelectorAll('[data-tts="stop"]').forEach(btn=>{btn.disabled=!tts.supported||Number(btn.dataset.index)!==active||tts.utterance==null});E.pagePlay.disabled=!tts.supported||!state.filtered.length;E.pageStop.disabled=!tts.supported||tts.mode!=="page";if(tts.mode==="page"&&tts.utterance){E.pagePlay.textContent=tts.paused?"▶ 계속":"⏸ 일시정지"}else E.pagePlay.textContent="▶ 현재 페이지"}
function speakIndex(index,{pageMode=false,rate=1}={}){if(!tts.supported)return;const item=state.filtered[index];if(!item)return;window.speechSynthesis.cancel();tts.mode=pageMode?"page":"card";tts.cardIndex=index;tts.paused=false;tts.rate=Number(rate)||1;const utterance=new SpeechSynthesisUtterance(newsSpeechText(item));utterance.lang="ko-KR";utterance.rate=tts.rate;utterance.pitch=1;const voice=koreanVoice();if(voice)utterance.voice=voice;tts.utterance=utterance;setCardStatus(index,pageMode?`현재 페이지 ${tts.pagePos+1}/${tts.pageIndices.length} 읽는 중 · ${tts.rate.toFixed(1)}x`:`읽는 중 · ${tts.rate.toFixed(1)}x`);utterance.onstart=()=>syncTtsUi();utterance.onend=()=>{setCardStatus(index,"");if(tts.mode==="page"&&pageMode){tts.pagePos+=1;if(tts.pagePos<tts.pageIndices.length){const next=tts.pageIndices[tts.pagePos];const nextRate=Number(document.querySelector(`[data-tts-rate="${next}"]`)?.value||1);speakIndex(next,{pageMode:true,rate:nextRate});return}}resetTtsState();syncTtsUi()};utterance.onerror=e=>{setCardStatus(index,e.error==="canceled"?"":"음성 재생을 완료하지 못했습니다.");if(e.error!=="canceled"){resetTtsState();syncTtsUi()}};window.speechSynthesis.speak(utterance);syncTtsUi()}
function playCard(index){if(!tts.supported)return;if(tts.cardIndex===index&&tts.utterance&&tts.paused){window.speechSynthesis.resume();tts.paused=false;setCardStatus(index,`읽는 중 · ${tts.rate.toFixed(1)}x`);syncTtsUi();return}const rate=Number(document.querySelector(`[data-tts-rate="${index}"]`)?.value||1);speakIndex(index,{rate})}
function togglePauseCard(index){if(!tts.supported||tts.cardIndex!==index||!tts.utterance)return;if(tts.paused){window.speechSynthesis.resume();tts.paused=false;setCardStatus(index,tts.mode==="page"?`현재 페이지 ${tts.pagePos+1}/${tts.pageIndices.length} 읽는 중 · ${tts.rate.toFixed(1)}x`:`읽는 중 · ${tts.rate.toFixed(1)}x`)}else{window.speechSynthesis.pause();tts.paused=true;setCardStatus(index,"일시정지")};syncTtsUi()}
function playCurrentPage(){if(!tts.supported||!state.filtered.length)return;if(tts.mode==="page"&&tts.utterance){if(tts.paused){window.speechSynthesis.resume();tts.paused=false;setCardStatus(tts.cardIndex,`현재 페이지 ${tts.pagePos+1}/${tts.pageIndices.length} 읽는 중 · ${tts.rate.toFixed(1)}x`)}else{window.speechSynthesis.pause();tts.paused=true;setCardStatus(tts.cardIndex,"일시정지")};syncTtsUi();return}const start=(state.page-1)*state.pageSize,end=Math.min(start+state.pageSize,state.filtered.length);tts.pageIndices=[];for(let i=start;i<end;i++)tts.pageIndices.push(i);tts.pagePos=0;const first=tts.pageIndices[0];const rate=Number(document.querySelector(`[data-tts-rate="${first}"]`)?.value||1);speakIndex(first,{pageMode:true,rate});E.pageLive.textContent=`현재 페이지 ${tts.pageIndices.length}건 음성 재생을 시작했습니다.`}
async function load(force=false){stopSpeech();E.refreshButton.disabled=true;clearOldCaches();const cached=!force&&cacheGet();if(cached){authed();state.items=cached.items.map(normalizeItem);populate();apply();E.updated.textContent=cached.updatedAt?`저장된 데이터 즉시 표시 · 최근 확인 ${cached.updatedAt}`:`저장된 데이터 ${state.items.length}건 즉시 표시`}else{E.statusPanel.hidden=false;E.statusPanel.textContent="데이터를 불러오는 중입니다."}try{const url=force?`/api/news?refresh=1&_=${Date.now()}`:`/api/news?_=${Date.now()}`;const r=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}});const raw=await r.text();let data=null;try{data=JSON.parse(raw)}catch{}if(r.status===401){loginView();return}if(!r.ok||!data||data.error){if(!cached){authed();E.statusPanel.className="status-panel error";E.statusPanel.textContent=data?.error||`서버 오류 HTTP ${r.status}`}return}authed();state.items=(Array.isArray(data.items)?data.items:[]).map(normalizeItem);if(state.items.length)cacheSet({...data,items:state.items});populate();apply();E.updated.textContent=data.updatedAt?`마지막 데이터 확인 ${data.updatedAt} · ${state.items.length}건`:`데이터 ${state.items.length}건 확인`}catch(err){if(!cached){authed();E.statusPanel.className="status-panel error";E.statusPanel.textContent="뉴스 API에 연결하지 못했습니다."}}finally{E.refreshButton.disabled=false}}
E.loginForm.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:E.password.value})});if(r.ok){E.password.value="";try{localStorage.removeItem(CACHE_KEY)}catch{}E.authLoading.hidden=false;E.authLogin.hidden=true;await load(true)}else E.loginError.textContent="로그인 요청을 처리하지 못했습니다."};
E.logoutButton.onclick=async()=>{stopSpeech();try{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"})}finally{try{localStorage.removeItem(CACHE_KEY)}catch{}state.items=[];state.filtered=[];loginView()}};
E.refreshButton.onclick=()=>load(true);
[E.searchInput,E.areaFilter,E.departmentFilter,E.dateFilter,E.sortSelect].forEach(el=>el.addEventListener(el.tagName==="INPUT"?"input":"change",apply));
E.pagination.onclick=e=>{const b=e.target.closest("button[data-page]");if(!b||b.disabled)return;stopSpeech();state.page=Number(b.dataset.page)||1;render();document.querySelector(".result-toolbar")?.scrollIntoView({behavior:"smooth"})};
E.cards.onclick=e=>{const b=e.target.closest("button[data-tts]");if(!b)return;const index=Number(b.dataset.index);if(b.dataset.tts==="play")playCard(index);else if(b.dataset.tts==="pause")togglePauseCard(index);else if(b.dataset.tts==="stop")stopSpeech()};
E.cards.onchange=e=>{const s=e.target.closest("select[data-tts-rate]");if(!s)return;const index=Number(s.dataset.ttsRate);if(index===tts.cardIndex&&tts.utterance){const wasPage=tts.mode==="page";const pagePos=tts.pagePos;const pageIndices=[...tts.pageIndices];speakIndex(index,{pageMode:wasPage,rate:Number(s.value)||1});if(wasPage){tts.pageIndices=pageIndices;tts.pagePos=pagePos}}};
E.pagePlay.onclick=playCurrentPage;
E.pageStop.onclick=stopSpeech;
E.metricTotal.onclick=()=>{E.searchInput.value="";E.areaFilter.value="";E.departmentFilter.value="";E.dateFilter.value="";apply()};
E.metricToday.onclick=()=>{E.dateFilter.value=day(new Date());apply()};
E.metricImportant.onclick=()=>{stopSpeech();state.filtered=state.items.filter(x=>Number(x.importance||0)>=90);state.page=1;render()};
E.metricShown.onclick=()=>document.querySelector(".result-toolbar")?.scrollIntoView({behavior:"smooth"});
window.addEventListener("beforeunload",stopSpeech);
if(!tts.supported){E.pageLive.textContent="이 브라우저에서는 음성 재생을 지원하지 않습니다."}
load();
</script>
</body>
